<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="#">Sobre Google</a>
            <a href="#">Tienda</a>
        </nav>

        <nav>
            <a href="#">Gmail</a>
            <a href="#">Imágenes</a>
            <span class="apps">⠿</span>
            <button class="login">Iniciar sesión</button>
        </nav>
    </header>

    <main>
        <div class="logo">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </div>

        <form id="searchForm">
            <div class="search-container">
                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder=""
                    autocomplete="off"
                >

                <span class="mic">🎤</span>
                <span class="camera">📷</span>
            </div>

            <div class="buttons">
                <button type="submit">Buscar con Google</button>
                <button type="button">Voy a tener suerte</button>
            </div>
        </form>

        <p class="language">
            Ofrecido por Google en:
            <a href="#">English</a>
        </p>
    </main>

    <footer>
        <div class="country">México</div>

        <div class="footer-links">
            <div>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>

            <div>
                <a href="#">Privacidad</a>
                <a href="#">Términos</a>
                <a href="#">Configuración</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
